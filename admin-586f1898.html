<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souq Amman</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#12805a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d9952a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='%232a1a03'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>try{var t=localStorage.getItem("souq_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="ready">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <canvas id="net"></canvas>

  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-mark">S</span>Souq Amman</a>
    <div class="nav-links">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a href="index.html" class="btn btn-line btn-sm">View store</a>
    </div>
  </nav>

  <main class="admin">
    <!-- Password gate -->
    <div class="lock" id="gate">
      <span class="logo-mark">S</span>
      <h1>Admin</h1>
      <p>Enter the password to continue.</p>
      <form id="loginForm" class="form" autocomplete="off">
        <div class="field">
          <div class="affix">
            <input id="pw" class="input" type="password" placeholder="Password" required autocomplete="current-password" aria-label="Password">
            <button type="button" id="pwToggle">Show</button>
          </div>
        </div>
        <button class="btn btn-dark" type="submit"><span class="spinner"></span><span>Unlock</span></button>
      </form>
    </div>

    <!-- Dashboard -->
    <section class="dash" id="dash">
      <div class="dash-head">
        <div>
          <span class="eyebrow" style="margin-bottom:4px">Admin</span>
          <h1>Add a product</h1>
        </div>
        <button class="btn btn-line btn-sm" id="logout" type="button">Lock 🔒</button>
      </div>

      <div class="dash-grid">
        <div class="panel">
          <form id="productForm" class="form">
            <div class="field">
              <label>Picture <em>required</em></label>
              <div class="drop" id="drop">
                <input type="file" id="file" accept="image/*" aria-label="Product picture">
                <div class="hint" id="dropHint"><div style="font-size:32px">📸</div><b>Click or drop a photo</b><small>JPG, PNG or WEBP — resized automatically</small></div>
              </div>
            </div>
            <div class="field">
              <label for="name">Name <em>required</em></label>
              <input id="name" class="input" maxlength="120" required placeholder="e.g. Leather handbag">
            </div>
            <div class="field">
              <label for="desc">Description <em>required</em></label>
              <textarea id="desc" class="textarea" maxlength="3000" required placeholder="Condition, size, colour, how to contact you…"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label for="price">Price <em>required</em></label>
                <div class="affix">
                  <input id="price" class="input" type="number" min="0" step="0.001" required placeholder="0.00" inputmode="decimal">
                  <span>JOD</span>
                </div>
              </div>
              <div class="field">
                <label for="addr">Address <em>optional</em></label>
                <input id="addr" class="input" maxlength="300" placeholder="e.g. Rainbow St, Jabal Amman">
              </div>
            </div>
            <button class="btn btn-brand" type="submit" id="publish"><span class="spinner"></span><span>Publish product</span></button>
          </form>
        </div>

        <div>
          <div class="pv-label">Live preview</div>
          <article class="card static">
            <div class="im"><img id="pvImg" alt="" style="display:none"><div id="pvPh" style="position:absolute;inset:0;display:grid;place-items:center;font-size:48px;opacity:.35">🖼️</div></div>
            <div class="body">
              <h3 id="pvName">Product name</h3>
              <p id="pvDesc">Your description will appear here.</p>
              <div class="foot"><div style="min-width:0"><div class="price" id="pvPrice">0 JOD</div><div class="loc">📍 <span id="pvAddr">Amman, Jordan</span></div></div><span class="go">↗</span></div>
            </div>
          </article>

          <div class="panel" style="margin-top:24px">
            <h2>Your products <span id="myCount" style="color:var(--muted);font-weight:500"></span></h2>
            <div class="my-list" id="myList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/effects.js"></script>
  <script src="assets/a-586f1898.js"></script>
</body>
</html>
